# XcodeGen spec — `xcodegen generate` in this directory produces PaceRail.xcodeproj.
#
# The project file is generated rather than committed on purpose: a .pbxproj is
# not reviewable, and this file is. Two targets:
#
#   PaceRail       iOS app — receives the mirrored workout, serves it on
#                  loopback for the glasses, posts it to the relay.
#   PaceRailWatch  watchOS app — owns the HKWorkoutSession and builds every
#                  snapshot. This is where all the numbers come from.
#
# Set DEVELOPMENT_TEAM below (or export it before generating) and everything else
# signs automatically.

name: PaceRail

options:
  bundleIdPrefix: xyz.grannis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Your ten-character Apple Developer team id. `xcodegen` will pick this up
    # from the environment if you would rather not commit it.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  PaceRail:
    type: application
    platform: iOS
    sources:
      - path: Phone
      - path: Shared
    dependencies:
      - target: PaceRailWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.grannis.pacerail
        PRODUCT_NAME: Pace Rail
        INFOPLIST_FILE: Phone/Info.plist
        CODE_SIGN_ENTITLEMENTS: Phone/PaceRail.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_CATALYST: NO
        GENERATE_INFOPLIST_FILE: NO

  PaceRailWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.grannis.pacerail.watchkitapp
        PRODUCT_NAME: Pace Rail
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/PaceRailWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
